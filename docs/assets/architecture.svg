<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Pulpitum architecture</title>
  <desc id="description">Clients use the DurableTable API directly or through an optional PostgreSQL-wire sidecar. Hot records and metadata live in CockroachDB, while immutable archives live in an S3-compatible object store. An opt-in archiver verifies and publishes immutable archives before cleanup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61758a"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f3040; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #52708b; letter-spacing: 1px; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f3040; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #526b7e; text-anchor: middle; dominant-baseline: middle; }
      .edge { fill: none; stroke: #61758a; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #8a9cad; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .node { stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="52" y="55" class="title">How Pulpitum fits together</text>

  <text x="52" y="105" class="section">CLIENT AND DATA PATH</text>
  <rect x="52" y="126" width="220" height="74" rx="12" fill="#e0f2fe" stroke="#38bdf8" class="node"/>
  <text x="162" y="156" class="label">Application client</text>
  <text x="162" y="179" class="small">Rust API or service</text>

  <rect x="52" y="250" width="220" height="74" rx="12" fill="#f3e8ff" stroke="#a855f7" class="node"/>
  <text x="162" y="280" class="label">Optional SQL sidecar</text>
  <text x="162" y="303" class="small">PostgreSQL wire protocol</text>

  <rect x="380" y="186" width="230" height="78" rx="12" fill="#dcfce7" stroke="#22c55e" class="node"/>
  <text x="495" y="216" class="label">DurableTable</text>
  <text x="495" y="239" class="small">Tier-transparent routing</text>

  <rect x="730" y="126" width="320" height="92" rx="12" fill="#fff7ed" stroke="#f97316" class="node"/>
  <text x="890" y="157" class="label">CockroachDB</text>
  <text x="890" y="181" class="small">Hot records + bucket metadata</text>

  <rect x="730" y="286" width="320" height="92" rx="12" fill="#eef2ff" stroke="#6366f1" class="node"/>
  <text x="890" y="317" class="label">S3-compatible object store</text>
  <text x="890" y="341" class="small">Immutable manifests + payloads</text>

  <path d="M272 163 H380" class="edge"/>
  <path d="M272 287 H320 V225 H380" class="edge"/>
  <path d="M610 212 H670 V172 H730" class="edge"/>
  <path d="M610 238 H670 V332 H730" class="edge"/>

  <text x="52" y="442" class="section">SCHEMA, ARCHIVAL, AND OBSERVABILITY</text>
  <rect x="52" y="470" width="220" height="72" rx="12" fill="#fef3c7" stroke="#eab308" class="node"/>
  <text x="162" y="499" class="label">Migration job</text>
  <text x="162" y="522" class="small">Versioned v4 schema</text>

  <rect x="348" y="470" width="175" height="72" rx="12" fill="#fee2e2" stroke="#ef4444" class="node"/>
  <text x="435" y="499" class="label">Opt-in archiver</text>
  <text x="435" y="522" class="small">Disabled by default</text>

  <rect x="600" y="470" width="170" height="72" rx="12" fill="#f1f5f9" stroke="#64748b" class="node"/>
  <text x="685" y="499" class="label">Claim lease</text>
  <text x="685" y="522" class="small">Fence writes</text>

  <rect x="847" y="470" width="190" height="72" rx="12" fill="#f1f5f9" stroke="#64748b" class="node"/>
  <text x="942" y="499" class="label">Verify + publish</text>
  <text x="942" y="522" class="small">Then clean hot rows</text>

  <rect x="730" y="630" width="320" height="72" rx="12" fill="#ecfeff" stroke="#06b6d4" class="node"/>
  <text x="890" y="659" class="label">OpenTelemetry</text>
  <text x="890" y="682" class="small">Metrics and traces</text>

  <path d="M162 470 V218 H730" class="edge-dashed"/>
  <path d="M523 506 H600" class="edge"/>
  <path d="M770 506 H847" class="edge"/>
  <path d="M942 470 V378" class="edge"/>
  <path d="M942 542 V590 H890 V630" class="edge"/>
  <path d="M495 264 V590 H890 V630" class="edge-dashed"/>
  <path d="M162 324 V590 H890 V630" class="edge-dashed"/>

  <text x="52" y="731" class="small" text-anchor="start">The safe default is hot-store operation. Enable archival only after the environment-specific fault acceptance criteria are complete.</text>
</svg>
