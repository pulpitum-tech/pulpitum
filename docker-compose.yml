name: pulpitum-jepsen

services:
  cockroach-1:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-1:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [cockroach-1:/cockroach/cockroach-data]
    networks: [pulpitum]
    healthcheck:
      test: ["CMD-SHELL", "cockroach node status --insecure --host=localhost:26257 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  cockroach-2:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-2:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [cockroach-2:/cockroach/cockroach-data]
    networks: [pulpitum]

  cockroach-3:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-3:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [cockroach-3:/cockroach/cockroach-data]
    networks: [pulpitum]

  cockroach-init:
    image: cockroachdb/cockroach:v25.4.10
    depends_on:
      cockroach-1:
        condition: service_started
    volumes:
      - ./docker/cockroach-init.sh:/cockroach/cockroach-init.sh:ro
    entrypoint: ["/bin/sh", "/cockroach/cockroach-init.sh"]
    restart: "no"
    networks: [pulpitum]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio:/data]
    ports: ["19001:9001"]
    networks: [pulpitum]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      ["/bin/sh", "-ec", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/pulpitum"]
    restart: "no"
    networks: [pulpitum]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./docker/toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["18474:8474", "26267:26257", "19000:9000"]
    networks: [pulpitum]

  e2e:
    profiles: [e2e]
    build:
      context: .
      dockerfile: docker/e2e-runner/Dockerfile
    environment:
      PULPITUM_E2E: "1"
      E2E_COCKROACH_HOST: toxiproxy
      E2E_COCKROACH_PORT: "26257"
      E2E_S3_ENDPOINT: http://toxiproxy:9000
    depends_on:
      toxiproxy:
        condition: service_started
    networks: [pulpitum]

volumes:
  cockroach-1:
  cockroach-2:
  cockroach-3:
  minio:

networks:
  pulpitum:
    name: pulpitum-jepsen-network
