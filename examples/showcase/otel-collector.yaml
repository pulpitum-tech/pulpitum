receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  batch: { timeout: 2s }
connectors:
  spanmetrics:
    dimensions:
      - name: db.operation.name
      - name: db.query.summary
      # Gateway dimensions keep dashboard SQL traffic separate from nested storage spans.
      - name: pulpitum.sql.origin
      - name: db.query.text
      # Literal statement capture is opt-in in the SQL sidecar.
      - name: pulpitum.sql.template
      # Fixed archival operation/phase labels only; never bucket or job IDs.
      - name: pulpitum.archive.operation
      - name: pulpitum.archive.coordinator.phase
exporters:
  prometheus: { endpoint: 0.0.0.0:8889 }
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  debug: {}
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
