name: pulpitum-showcase

# A same-region, cross-AZ hop is typically around 1 ms one way. Every
# Cockroach node gets this egress qdisc, so inter-node RTT is approximately
# twice SHOWCASE_COCKROACH_AZ_DELAY plus jitter. The sidecar shares the node's
# network namespace; the qdisc remains after the sidecar exits.
x-cockroach-netem: &cockroach-netem
  image: alpine:3.21
  cap_add: [NET_ADMIN]
  restart: "no"
  environment:
    NETEM_DELAY: "${SHOWCASE_COCKROACH_AZ_DELAY:-1ms}"
    NETEM_JITTER: "${SHOWCASE_COCKROACH_AZ_JITTER:-200us}"
  entrypoint:
    - /bin/sh
    - -ec
    - |
      apk add --no-cache iproute2
      tc qdisc replace dev eth0 root netem delay "$$NETEM_DELAY" "$$NETEM_JITTER" distribution normal
      tc qdisc show dev eth0

services:
  cockroach-1:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-1:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [showcase-cockroach-1:/cockroach/cockroach-data]
    ports: ["26277:26257"]
    networks: [showcase]
    healthcheck:
      test: ["CMD-SHELL", "cockroach node status --insecure --host=localhost:26257 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
  cockroach-2:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-2:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [showcase-cockroach-2:/cockroach/cockroach-data]
    networks: [showcase]
  cockroach-3:
    image: cockroachdb/cockroach:v25.4.10
    command: >-
      start --insecure --store=/cockroach/cockroach-data
      --listen-addr=0.0.0.0:26257 --advertise-addr=cockroach-3:26257
      --http-addr=0.0.0.0:8080
      --join=cockroach-1:26257,cockroach-2:26257,cockroach-3:26257
    volumes: [showcase-cockroach-3:/cockroach/cockroach-data]
    networks: [showcase]
  cockroach-1-netem:
    <<: *cockroach-netem
    network_mode: service:cockroach-1
    depends_on:
      cockroach-1: { condition: service_started }
  cockroach-2-netem:
    <<: *cockroach-netem
    network_mode: service:cockroach-2
    depends_on:
      cockroach-2: { condition: service_started }
  cockroach-3-netem:
    <<: *cockroach-netem
    network_mode: service:cockroach-3
    depends_on:
      cockroach-3: { condition: service_started }

  cockroach-init:
    image: cockroachdb/cockroach:v25.4.10
    depends_on:
      cockroach-1-netem: { condition: service_completed_successfully }
      cockroach-2-netem: { condition: service_completed_successfully }
      cockroach-3-netem: { condition: service_completed_successfully }
    volumes: ["./docker/cockroach-init.sh:/cockroach/cockroach-init.sh:ro"]
    entrypoint: ["/bin/sh", "/cockroach/cockroach-init.sh"]
    networks: [showcase]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [showcase-minio:/data]
    ports: ["19010:9000", "19011:9001"]
    networks: [showcase]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: { minio: { condition: service_healthy } }
    entrypoint:
      ["/bin/sh", "-ec", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/pulpitum"]
    networks: [showcase]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./examples/showcase/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    networks: [showcase]
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16696:16686"]
    networks: [showcase]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    privileged: true
    cgroup: host
    pid: host
    volumes:
      - "/:/rootfs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"
      - "/dev/disk:/dev/disk:ro"
    networks: [showcase]
  prometheus:
    image: prom/prometheus:v3.3.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["19090:9090"]
    depends_on: [otel-collector, cadvisor]
    networks: [showcase]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      JAEGER_URL: http://jaeger:16686
    ports: ["13000:3000"]
    volumes:
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./observability/grafana:/var/lib/grafana/dashboards:ro"
    depends_on: [prometheus, jaeger]
    networks: [showcase]
  migrator:
    build: { context: ., dockerfile: examples/showcase/Dockerfile }
    entrypoint: ["/usr/local/bin/pulpitum-migrate"]
    environment:
      COCKROACH_MIGRATION_URL: postgresql://root@cockroach-1:26257/defaultdb?sslmode=disable
      PULPITUM_RUNTIME_ROLE: pulpitum_runtime
      RUST_LOG: pulpitum=info
    depends_on:
      cockroach-init: { condition: service_completed_successfully }
    restart: "no"
    networks: [showcase]

  sql-sidecar:
    build: { context: ., dockerfile: examples/showcase/Dockerfile }
    entrypoint: ["/usr/local/bin/pulpitum-sql-sidecar"]
    ports: ["15432:5433"]
    environment:
      COCKROACH_URL: postgresql://pulpitum_runtime@cockroach-1:26257/defaultdb?sslmode=disable
      COCKROACH_POOL_MAX_CONNECTIONS: "64"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ALLOW_HTTP: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PULPITUM_SQL_LISTEN_ADDR: 0.0.0.0:5433
      PULPITUM_SQL_ALLOW_INSECURE_NON_LOOPBACK: "true"
      PULPITUM_SQL_TABLE: messages
      PULPITUM_SQL_TABLE_ID: pulpitum.showcase.messages.v3
      PULPITUM_SQL_ARCHIVE_PREFIX: showcase
      # Keep telemetry parameterized; enable literal capture only for a short, approved investigation.
      PULPITUM_SQL_CAPTURE_QUERY_TEXT: "false"
      ARCHIVE_FORMAT: json
      RUST_LOG: pulpitum=info,showcase=info
    depends_on:
      migrator: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
    networks: [showcase]

  archiver:
    build: { context: ., dockerfile: examples/showcase/Dockerfile }
    entrypoint: ["/usr/local/bin/pulpitum-archiver"]
    environment:
      COCKROACH_URL: postgresql://pulpitum_runtime@cockroach-1:26257/defaultdb?sslmode=disable
      COCKROACH_POOL_MAX_CONNECTIONS: "2"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ALLOW_HTTP: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ARCHIVER_PREFIX: showcase
      PULPITUM_ARCHIVAL_ENABLED: "true"
      ARCHIVE_FORMAT: json
      ARCHIVER_INTERVAL_SECONDS: "${ARCHIVER_INTERVAL_SECONDS:-60}"
      ARCHIVER_LEASE_SECONDS: "30"
      ARCHIVER_LEASE_RENEWAL_SECONDS: "10"
      ARCHIVER_RETRY_SECONDS: "10"
      RUST_LOG: pulpitum=info
    depends_on:
      migrator: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
    networks: [showcase]

  workload:
    build: { context: ., dockerfile: examples/showcase/Dockerfile }
    ports: ["18080:8080"]
    environment:
      COCKROACH_URL: postgresql://pulpitum_runtime@cockroach-1:26257/defaultdb?sslmode=disable
      COCKROACH_POOL_MAX_CONNECTIONS: "64"
      S3_ENDPOINT: http://minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ARCHIVE_FORMAT: json
      SHOWCASE_SQL_URL: postgresql://pulpitum@sql-sidecar:5433/pulpitum?sslmode=disable
      SHOWCASE_LOAD_TARGET_RPS: "50"
      RUST_LOG: pulpitum=info,showcase=info
    depends_on:
      migrator: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
      sql-sidecar: { condition: service_started }
    networks: [showcase]

volumes:
  showcase-cockroach-1:
  showcase-cockroach-2:
  showcase-cockroach-3:
  showcase-minio:
networks:
  showcase:
    name: pulpitum-showcase-network
